[package]
name = "herdr-jira"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Jira TUI plugin for herdr (fork of a2u/herdr-jira): filters, search, issue comments, status transitions, agent delegation, and Git worktree or native jj workspace checkout"
repository = "https://github.com/hanbong5938/herdr-jira-worktree"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"

[profile.release]
strip = true
lto = true
