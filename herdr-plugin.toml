# herdr-plugin.toml — manifest for the han.jira-worktree plugin.
# Find a Jira issue via JQL, then optionally open a Git worktree or native jj
# workspace or start an agent. This is not a full Jira replacement.
#
# Configuration is outside the plugin checkout. After a remote install, create
# config.toml in `herdr plugin config-dir han.jira-worktree` using README's
# minimal example; config.example.toml is only available from a local clone.

id = "han.jira-worktree"
name = "Jira Worktree"
version = "0.4.0"
description = "Jira TUI in a herdr pane: JQL filters, search, comments, manual status transitions, and reviewed bounded Jira-context handoff to agents, optionally in a Git worktree or native jj workspace."
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

# Build from source at install/link time (requires a Rust toolchain).
[[build]]
command = ["/bin/sh", "scripts/build.sh"]

# The Jira pane. `placement = "split"` opens it beside the current pane; the
# tab launcher below overrides placement at open time.
[[panes]]
id = "jira"
title = "Jira"
placement = "split"
command = ["./target/release/herdr-jira"]

# Open the Jira TUI in a split beside the current pane (focus if already open).
[[actions]]
id = "open-jira"
title = "Jira: open (split)"
description = "Open the Jira TUI in a split pane beside the current work."
command = ["bash", "scripts/open-jira.sh"]

# Open the Jira TUI in its own tab (focus if already open).
[[actions]]
id = "open-jira-tab"
title = "Jira: open (tab)"
description = "Open the Jira TUI in its own tab."
command = ["bash", "scripts/open-jira-tab.sh"]
